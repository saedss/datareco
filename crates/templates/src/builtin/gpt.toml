# GUID Partition Table. Layout: UEFI specification, chapter 5.3.

[[template]]
id = "gpt_header"
name = "GPT header"
group = "Partition tables"
description = "LBA 1 of a GPT disk (the primary header), with a backup copy in the disk's last sector."
size = 92
extent = 512
signature = [{ offset = 0, ascii = "EFI PART" }]

[[template.field]]
name = "Signature"
offset = 0
type = "ascii"
length = 8

[[template.field]]
name = "Revision"
offset = 8
type = "u32"
format = "hex"
values = { "0x00010000" = "1.0" }

[[template.field]]
name = "Header size"
offset = 12
type = "u32"

[[template.field]]
name = "Header CRC32"
offset = 16
type = "u32"
format = "hex"

[[template.field]]
name = "Reserved"
offset = 20
type = "u32"

[[template.field]]
name = "This header's LBA"
id = "my_lba"
offset = 24
type = "u64"

[[template.field]]
name = "Other header's LBA"
id = "alternate_lba"
offset = 32
type = "u64"
description = "Where the backup header is (in the primary header), or the primary header (in the backup)."

[[template.field]]
name = "First usable LBA"
offset = 40
type = "u64"

[[template.field]]
name = "Last usable LBA"
offset = 48
type = "u64"

[[template.field]]
name = "Disk GUID"
offset = 56
type = "guid"

[[template.field]]
name = "Partition entries LBA"
id = "entries_lba"
offset = 72
type = "u64"

[[template.field]]
name = "Number of partition entries"
id = "entry_count"
offset = 80
type = "u32"

[[template.field]]
name = "Size of a partition entry"
id = "entry_size"
offset = 84
type = "u32"

[[template.field]]
name = "Partition entries CRC32"
offset = 88
type = "u32"
format = "hex"


[[template]]
id = "gpt_entries"
name = "GPT partition entries"
group = "Partition tables"
description = "The partition entry array (usually from LBA 2): 128-byte entries. Unused entries have an all-zero type GUID."
extent = 16384

[[template.field]]
name = "Entries"
offset = 0
type = "struct"
template = "gpt_entry"
count = "fill"


[[template]]
id = "gpt_entry"
name = "GPT partition entry"
group = "Partition tables"
size = 128
summary = "{name}"

[[template.field]]
name = "Type"
id = "type"
offset = 0
type = "guid"
[template.field.values]
"00000000-0000-0000-0000-000000000000" = "unused entry"
"C12A7328-F81F-11D2-BA4B-00A0C93EC93B" = "EFI system partition"
"21686148-6449-6E6F-744E-656564454649" = "BIOS boot partition"
"E3C9E316-0B5C-4DB8-817D-F92DF00215AE" = "Microsoft reserved"
"EBD0A0A2-B9E5-4433-87C0-68B6B72699C7" = "Microsoft basic data"
"DE94BBA4-06D1-4D40-A16A-BFD50179D6AC" = "Windows recovery"
"5808C8AA-7E8F-42E0-85D2-E1E90434CFB3" = "Windows LDM metadata"
"AF9B60A0-1431-4F62-BC68-3311714A69AD" = "Windows LDM data"
"E75CAF8F-F680-4CEE-AFA3-B001E56EFC2D" = "Windows Storage Spaces"
"0FC63DAF-8483-4772-8E79-3D69D8477DE4" = "Linux file system"
"0657FD6D-A4AB-43C4-84E5-0933C84B4F4F" = "Linux swap"
"E6D6D379-F507-44C2-A23C-238F2A3DF928" = "Linux LVM"
"A19D880F-05FC-4D3B-A006-743F0F84911E" = "Linux RAID"
"4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709" = "Linux root (x86-64)"
"933AC7E1-2EB4-4F13-B844-0E14E2AEF915" = "Linux /home"
"48465300-0000-11AA-AA11-00306543ECAC" = "Apple HFS+"
"7C3457EF-0000-11AA-AA11-00306543ECAC" = "Apple APFS"
"516E7CB4-6ECF-11D6-8FF8-00022D09712B" = "FreeBSD data"
"AA31E02A-400F-11DB-9590-000C2911D1B8" = "VMware VMFS"

[[template.field]]
name = "Unique GUID"
offset = 16
type = "guid"

[[template.field]]
name = "First LBA"
offset = 32
type = "u64"

[[template.field]]
name = "Last LBA"
offset = 40
type = "u64"
description = "Inclusive: the partition's last sector."

[[template.field]]
name = "Attributes"
offset = 48
type = "u64"
format = "hex"
[template.field.flags]
"0x1" = "required by the platform"
"0x2" = "ignore (no block I/O protocol)"
"0x4" = "legacy BIOS bootable"
"0x1000000000000000" = "read-only (Microsoft)"
"0x2000000000000000" = "shadow copy (Microsoft)"
"0x4000000000000000" = "hidden (Microsoft)"
"0x8000000000000000" = "no drive letter (Microsoft)"

[[template.field]]
name = "Name"
offset = 56
type = "utf16"
length = 72
