name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
      - name: Lint and build desktop app
        run: cargo clippy -p datareco-gui --all-targets -- -D warnings

  test-images:
    name: Test disk images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install file-system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs ntfs-3g e2fsprogs fdisk
      - name: Build images
        run: sudo python3 testdata/make_images.py --out testdata/out
      - uses: actions/upload-artifact@v7
        with:
          name: test-images
          path: testdata/out
          retention-days: 14
