name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# DataReco targets Windows for now; Linux and macOS builds come in Phase 11
# (docs/ROADMAP.md).
jobs:
  engine:
    name: Engine and CLI
    # Tests read the disk images built by the test-images job.
    needs: test-images
    runs-on: windows-latest
    env:
      # Fail, rather than skip, the image tests if the images are missing.
      DATARECO_REQUIRE_TESTDATA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-images
          path: testdata/out
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  desktop:
    name: Desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
      - name: Lint and build desktop app
        run: cargo clippy -p datareco-gui --all-targets -- -D warnings

  test-images:
    name: Test disk images
    # Formatting and mounting FAT/exFAT/NTFS/ext4/HFS+/btrfs images needs Linux tools, so
    # this job runs on Linux. It only produces test data; it builds no app.
    # Same Ubuntu release as testdata/docker/Dockerfile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install file-system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs exfat-fuse ntfs-3g e2fsprogs fdisk hfsprogs btrfs-progs
          # HFS+ needs a kernel driver that cloud kernels keep in their extra
          # modules. Without it, the generator skips the HFS+ image.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "no extra kernel modules"
          sudo modprobe hfsplus || echo "no HFS+ driver in this kernel"
      - name: Build images
        # GITHUB_ACTIONS tells the generator to report failures as annotations.
        run: sudo --preserve-env=GITHUB_ACTIONS python3 testdata/make_images.py --out testdata/out
      - uses: actions/upload-artifact@v7
        with:
          name: test-images
          path: testdata/out
          retention-days: 14
